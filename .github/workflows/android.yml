name: Android APK

# Builds the shop app APK on GitHub's free runners (no EAS account needed).
# Every run uploads the APK as a downloadable artifact; a v* tag also
# attaches it to a GitHub release.
#
# Signing: add these repository secrets to sign with the shop's own key
# (see README). Without them the APK is signed with a debug key, which is
# fine for testing but can't be updated by a properly signed build later.
#   STIX_KEYSTORE_BASE64, STIX_KEYSTORE_PASSWORD, STIX_KEY_ALIAS, STIX_KEY_PASSWORD

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      shop_url:
        description: "Shop the app talks to (e.g. a Netlify deploy preview). Empty = shop.stixnvibes.com"
        required: false
        default: ""

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  apk:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      EXPO_PUBLIC_SHOP_URL: ${{ inputs.shop_url || vars.SHOP_URL || 'https://shop.stixnvibes.com' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci

      - name: Generate the native Android project
        run: npx expo prebuild --platform android --no-install

      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.STIX_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/stix-release.keystore"
            echo "STIX_KEYSTORE_FILE=$RUNNER_TEMP/stix-release.keystore" >> "$GITHUB_ENV"
            echo "Signing with the shop's release key."
          else
            echo "::warning::No STIX_KEYSTORE_BASE64 secret: this APK is signed with a debug key (testing only)."
          fi

      - name: Build release APK
        working-directory: android
        env:
          STIX_KEYSTORE_PASSWORD: ${{ secrets.STIX_KEYSTORE_PASSWORD }}
          STIX_KEY_ALIAS: ${{ secrets.STIX_KEY_ALIAS }}
          STIX_KEY_PASSWORD: ${{ secrets.STIX_KEY_PASSWORD }}
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a,armeabi-v7a --no-daemon

      - name: Name the APK
        id: apk
        run: |
          short=$(git rev-parse --short HEAD)
          name="stixnvibes-shop-${GITHUB_REF_NAME//\//-}-${short}.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$name"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "Shop URL baked in: $EXPO_PUBLIC_SHOP_URL" >> "$GITHUB_STEP_SUMMARY"
          ls -la "$name"

      - uses: actions/upload-artifact@v4
        with:
          name: stixnvibes-shop-apk
          path: ${{ steps.apk.outputs.name }}
          retention-days: 30

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "${{ steps.apk.outputs.name }}" --title "Shop app $GITHUB_REF_NAME" --generate-notes
